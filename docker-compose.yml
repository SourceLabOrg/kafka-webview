## Local development / demo stack: single-node KRaft Kafka + Kafka WebView.
##
## Usage:
##   docker compose up --build
##
## Web UI:    http://localhost:8080  (login: admin@example.com / admin)
## Actuator:  http://localhost:9090/actuator/health
##
## When registering the cluster inside the WebView UI, use broker host: kafka:19092
## From your host machine (e.g. kafka-console-producer), use: localhost:9092
services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  webview:
    build: .
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - webview-data:/app/data
    depends_on:
      - kafka

volumes:
  webview-data:
