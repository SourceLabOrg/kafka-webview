server:
  port: ${PORT:8080}
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
    mbeanregistry:
      enabled: true
    ## Tomcat 10.1.42+ limits multipart requests to 10 parts by default (CVE-2025-48976
    ## mitigation). Configuration forms (cluster, filter, message format) submit more
    ## fields than that, which breaks multipart parsing and fails CSRF validation with a 403.
    max-part-count: 100
  servlet:
    session:
      ## User sessions should not be persistent across service restarts by default.
      persistent: false
      ## User login session timeout after 1 hour (3600 seconds)
      timeout: 3600

spring:
  application:
    name: Kafka Webview
  datasource:
    url: "jdbc:h2:file:./data/db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER,VALUE,KEY"
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    locations: "classpath:schema/migration/{vendor}"
    baselineOnMigrate: true
    validate-on-migrate: false

  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 64MB

  thymeleaf:
    cache: false
    enabled: true
    prefix: "classpath:/templates/"
    suffix: ".html"
    mode: HTML
    encoding: UTF-8
    check-template-location: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: true

# Spring Actuator - global
management:
  server:
    port: ${ACTUATOR_PORT:9090}
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  health:
    ## Enable probes to get liveness and readiness checks for kubernetes
    ## See https://spring.io/blog/2020/03/25/liveness-and-readiness-probes-with-spring-boot
    probes:
      enabled: false

# Spring Actuator - Info endpoint
info:
  app:
    name: ${spring.application.name}

## Various App Configs
app:
  name: Kafka Web View
  uploadPath: "./data/uploads"
  key: "SuperSecretKey"
  multiThreadedConsumer: true
  maxConcurrentWebConsumers: 32
  maxConcurrentWebSocketConsumers: 64
  consumerIdPrefix: "KafkaWebViewConsumer"
  user:
    ## By default, require user authentication.
    enabled: true

