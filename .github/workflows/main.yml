name: CI Test Suite

# Triggers the workflow on pull requests, manually, or pushes to master
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      ## Run tests against Java 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      ## Compile and install locally
      - name: Compile and install locally
        run: mvn clean install -DskipTests=true -Dmaven.javadoc.skip=true -B -V

      ## Ensure data directory exists
      - name: Ensure data directory exists
        run: mkdir -p ./data/uploads

      ## Generate dummy SSL certificates
      - name: Generate dummy SSL certificates
        run: ./generateDummySslCertificates.sh

      ## Run test suite
      - name: Run test suite
        run: mvn test -B -Dmaven.javadoc.skip=true -Djava.security.auth.login.config=${PWD}/kafka-webview-ui/src/test/resources/jaas.conf

      ## Package
      - name: Package
        run: mvn package -DskipTests=true -Dmaven.javadoc.skip=true

      ## Upload Artifact
      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: package.zip
          path: kafka-webview-ui/target/kafka-webview-ui-*-bin.zip
          retention-days: 3
